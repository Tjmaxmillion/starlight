- type: entity
  name: NanoTrasen representative's pen
  parent: [ BaseContrabandTier3, PenEmbeddable, BaseNanoTrasenContraband ]
  id: PenNTR
  description: The NT Representative's own unique pen, just not as sharp.
  categories: [ DoNotMap ]
  components:
    - type: Sprite
      sprite: _Starlight/Objects/Misc/pens.rsi
      layers:
        - state: pen_ntr
    - type: Item
      sprite: _Starlight/Objects/Misc/pens.rsi
      heldPrefix: pen_ntr
    - type: Tag
      tags:
        - Write
        - Pen
    - type: StealTarget
      stealGroup: NTRPen
    - type: CustomSignature
      config:
        penColor:
          - "#6b4500"
          - "#b88514"
          - "#fff2a8"
          - "#b88514"
          - "#523400"

