- type: !PartialOnly entity
  id: PenIAA
  components:
  - type: PairedPen
    pairIds:
    - IAA
    - Approved
    - Denied
  - type: TapeRecorder
  - type: ActiveListener
    range: 4
  - type: Speech
  - type: TextToSpeech
  - type: ItemSlots
    slots:
      cassette_tape:
        priority: 4
        startingItem: CassetteTape
        whitelist:
          components:
          - FitsInTapeRecorder
  - type: ContainerContainer
    containers:
      cassette_tape: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.TapeRecorderUIKey.Key
    inHandsOnly: true
    requireActiveHand: false
  - type: UserInterface
    interfaces:
      enum.TapeRecorderUIKey.Key:
        type: TapeRecorderBoundUserInterface

