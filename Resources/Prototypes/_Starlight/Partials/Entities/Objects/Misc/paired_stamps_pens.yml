# Pens

- type: !PartialOnly entity
  id: PenCap
  components:
  - type: PairedPen
    pairIds:
    - Captain
    - HOP
    - HOS
    - Warden
    - CE
    - CMO
    - RD
    - QM
    - Approved
    - Denied

- type: !PartialOnly entity
  id: PenHop
  components:
  - type: PairedPen
    pairIds:
    - HOP
    - Approved
    - Denied
  - type: ActivatableUI
    key: enum.HandLabelerUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.HandLabelerUiKey.Key:
        type: HandLabelerBoundUserInterface
  - type: ItemSwitch
    onUse: false
    onAltUse: true
    state: pen
    states:
      pen: !type:ItemSwitchState
        verb: pen-mode-pen
        soundStateActivate:
          path: /Audio/Items/pen_click.ogg
        components:
        - type: Tag
          tags:
          - Write
          - Pen
      labeler: !type:ItemSwitchState
        verb: pen-mode-labeler
        activatableUiKey: enum.HandLabelerUiKey.Key
        soundStateActivate:
          path: /Audio/Items/pen_click.ogg
        components:
        - type: HandLabeler
          blacklist:
            tags:
            - NotLabelable
          whitelist:
            components:
            - Item
            - WallMount
            tags:
            - Structure
            - Labelable

- type: !PartialOnly entity
  id: PenHOS
  components:
  - type: PairedPen
    pairIds:
    - HOS
    - Warden
    - Approved
    - Denied
  - type: MeleeWeapon
    wideAnimationRotation: -45
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

- type: !PartialOnly entity
  id: PenWarden
  components:
  - type: PairedPen
    pairIds:
    - Warden
    - Approved
    - Denied
  - type: MeleeWeapon
    wideAnimationRotation: -45
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

- type: !PartialOnly entity
  id: PenCE
  components:
  - type: PairedPen
    pairIds:
    - CE
    - Approved
    - Denied
  - type: ActivatableUI
    key: enum.NetworkConfiguratorUiKey.List
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.NetworkConfiguratorUiKey.List:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Configure:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Link:
        type: NetworkConfiguratorBoundUserInterface
  - type: ItemSwitch
    onAltUse: true
    state: pen
    states:
      pen: !type:ItemSwitchState
        verb: pen-mode-pen-screwdriver
        soundStateActivate:
          path: /Audio/Items/pen_click.ogg
        components:
        - type: Tag
          tags:
          - Write
          - Pen
        - type: Tool
          qualities:
          - Screwing
          useSound:
            collection: Screwdriver
      multitool: !type:ItemSwitchState
        verb: pen-mode-multitool
        activatableUiKey: enum.NetworkConfiguratorUiKey.List
        soundStateActivate:
          path: /Audio/Items/change_drill.ogg
        components:
        - type: Tool
          qualities:
          - Pulsing
        - type: NetworkConfigurator
        - type: Tag
          tags:
          - Multitool
          - DoorElectronicsConfigurator

- type: !PartialOnly entity
  id: PenCMO
  components:
  - type: PairedPen
    pairIds:
    - CMO
    - Approved
    - Denied
  - type: Solution
    id: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Epinephrine
        Quantity: 10
  - type: SolutionRegeneration
    duration: 300
    generated:
      reagents:
      - ReagentId: Epinephrine
        Quantity: 10
  - type: Injector
    solutionName: hypospray
    ignoreClosed: true
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
    currentTransferAmount: 10
    reagentWhitelist:
    - Epinephrine
  - type: ExaminableSolution
    solution: hypospray
    exactVolume: true

- type: !PartialOnly entity
  id: PenRD
  components:
  - type: PairedPen
    pairIds:
    - RD
    - Approved
    - Denied
  - type: ActivatableUI
    key: enum.AnomalyScannerUiKey.Key
    requireActiveHand: false
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.AnomalyScannerUiKey.Key:
        type: AnomalyScannerBoundUserInterface
  - type: AnomalyScanner
  - type: GuideHelp
    guides:
    - ScannersAndVessels

