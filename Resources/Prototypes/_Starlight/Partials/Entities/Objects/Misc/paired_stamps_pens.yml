- type: !PartialOnly entity
  id: PenNTR
  components:
  - type: PairedPen
    pairIds:
    - NTR
    - IAA
    - Approved
    - Denied
  - type: TriggerOnVerb
    text: verb-panic-button
    keyOut: panic
  - type: EmitSoundOnTrigger
    keysIn:
    - panic
    sound:
      collection: TriggerActivate
  - type: RattleOnTrigger
    keysIn:
    - panic
    radioChannel:
    - NanoTrasen
    targetUser: true
    messages:
      Alive: rattle-on-trigger-distress-message
  - type: RemoveComponentsOnTrigger
    keysIn:
    - panic
    components:
    - type: TriggerOnVerb
  - type: TimerTrigger
    keysIn:
    - panic
    delay: 120
    examinable: false
    popup: null
    keyOut: reset_panic
  - type: AddComponentsOnTrigger
    keysIn:
    - reset_panic
    components:
    - type: TriggerOnVerb
      text: verb-panic-button
      keyOut: panic

